<svg
  viewBox="0 0 390 820"
  preserveAspectRatio="xMinYMin meet"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .band {
      fill: none;
      stroke-width: 56;
      stroke-linecap: butt;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: reveal 1.35s cubic-bezier(.65, 0, .2, 1) .12s both;
    }

    @keyframes reveal {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .band {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <!--
    Poppins 700 reference size: 46 units.
    Bands: 56 units. Centre spacing: 60 units. Constant visible gap: 4 units.
    The yellow centre line uses the same 115-unit radius in both turns.
  -->
  <path
    class="band"
    pathLength="1"
    stroke="#FF3021"
    d="M -30 220 H 180 A 175 175 0 0 1 355 395 A 55 55 0 0 0 410 450 H 440"
  />
  <path
    class="band"
    pathLength="1"
    stroke="#F5C964"
    d="M -30 280 H 180 A 115 115 0 0 1 295 395 A 115 115 0 0 0 410 510 H 440"
  />
  <path
    class="band"
    pathLength="1"
    stroke="#00C7D2"
    d="M -30 340 H 180 A 55 55 0 0 1 235 395 A 175 175 0 0 0 410 570 H 440"
  />
</svg>
