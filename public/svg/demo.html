<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emir Maya — Retro SVG Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; font-family: Poppins, Arial, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #050505; }
      body { overflow-x: hidden; }
      .hero { --bg: #050505; position: relative; min-height: max(740px, 56.25vw); overflow: hidden; color: #f7f5ef; background: var(--bg); }
      header { position: relative; z-index: 3; display: flex; justify-content: space-between; width: calc(100% - 80px); margin: auto; padding-top: 36px; }
      .brand strong, .brand span { display: block; }
      .brand strong { font-size: 23px; font-weight: 600; line-height: 1; }
      .brand span { margin-top: 8px; font-size: 12px; letter-spacing: .14em; }
      nav { position: absolute; left: 50%; display: flex; gap: 56px; transform: translateX(-50%); }
      nav a, .actions a { color: inherit; text-decoration: none; }
      nav a { font-size: 15px; font-weight: 500; letter-spacing: .08em; }
      svg { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .mobile-svg { display: none; }
      .band { fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linecap: butt; stroke-linejoin: round; animation: reveal 1.45s cubic-bezier(.65,0,.2,1) .18s both; }
      .svg-copy { fill: #f7f5ef; font-family: Poppins, Arial, sans-serif; font-size: 96px; font-weight: 700; letter-spacing: -.045em; }
      .svg-copy.mobile { font-size: 38px; letter-spacing: -.055em; }
      .cutout { fill: var(--bg); }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      .intro { position: absolute; z-index: 2; bottom: 24px; left: clamp(84px, 8.7vw, 148px); }
      .intro p { margin: 0; font-size: 15px; line-height: 1.65; letter-spacing: .045em; }
      .actions { display: flex; gap: 72px; margin-top: 24px; }
      .actions a { font-size: 13px; font-weight: 500; letter-spacing: .11em; }
      @keyframes reveal { to { stroke-dashoffset: 0; } }
      @media (max-width: 600px) {
        .hero { min-height: clamp(720px, 160vw, 960px); }
        header { width: calc(100% - 36px); padding-top: 24px; }
        .brand strong { font-size: 17px; }
        .brand span { margin-top: 5px; font-size: 9px; }
        nav { position: static; gap: 16px; transform: none; }
        nav a { font-size: 11px; }
        nav a:nth-child(2) { display: none; }
        .desktop-svg { display: none; }
        .mobile-svg { display: block; }
        .intro { top: clamp(538px, 138vw, 810px); bottom: auto; left: 24px; max-width: 290px; }
        .intro p { font-size: 12px; }
        .actions { flex-direction: column; gap: 18px; margin-top: 20px; }
        .actions a { font-size: 11px; }
      }
      @media (prefers-reduced-motion: reduce) { .band { animation: none; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <main class="hero" id="top">
      <header>
        <div class="brand"><strong>EMIR MAYA</strong><span>FULL-STACK DEVELOPER</span></div>
        <nav aria-label="Main navigation"><a href="#work">WORK</a><a href="#about">ABOUT</a><a href="#contact">CONTACT</a></nav>
      </header>

      <svg class="desktop-svg" aria-hidden="true" viewBox="0 0 1600 900" preserveAspectRatio="xMinYMin slice">
        <path class="band" pathLength="1" stroke="#FF3021" stroke-width="108" d="M -60 460 H 1000 A 500 500 0 0 1 1500 960 V 1040" />
        <path class="band" pathLength="1" stroke="#F5C964" stroke-width="108" d="M -60 574 H 1000 A 386 386 0 0 1 1386 960 V 1040" />
        <path class="band" pathLength="1" stroke="#00C7D2" stroke-width="108" d="M -60 688 H 1000 A 272 272 0 0 1 1272 960 V 1040" />

        <g class="svg-copy">
          <rect class="cutout" x="270" y="406" width="400" height="108" />
          <text x="305" y="460" dominant-baseline="middle">I BUILD</text>
          <rect class="cutout" x="315" y="520" width="635" height="108" />
          <text x="350" y="574" dominant-baseline="middle">USEFUL WEB</text>
          <rect class="cutout" x="395" y="634" width="700" height="108" />
          <text x="430" y="688" dominant-baseline="middle">EXPERIENCES.</text>
        </g>
      </svg>

      <svg class="mobile-svg" aria-hidden="true" viewBox="0 0 390 820" preserveAspectRatio="xMinYMin slice">
        <path class="band" pathLength="1" stroke="#FF3021" stroke-width="68" d="M -30 330 H 220 A 320 320 0 0 1 540 650 V 880" />
        <path class="band" pathLength="1" stroke="#F5C964" stroke-width="68" d="M -30 402 H 220 A 248 248 0 0 1 468 650 V 880" />
        <path class="band" pathLength="1" stroke="#00C7D2" stroke-width="68" d="M -30 474 H 220 A 176 176 0 0 1 396 650 V 880" />

        <g class="svg-copy mobile">
          <rect class="cutout" x="22" y="296" width="170" height="68" />
          <text x="31" y="330" dominant-baseline="middle">I BUILD</text>
          <rect class="cutout" x="52" y="368" width="250" height="68" />
          <text x="61" y="402" dominant-baseline="middle">USEFUL WEB</text>
          <rect class="cutout" x="84" y="440" width="286" height="68" />
          <text x="93" y="474" dominant-baseline="middle">EXPERIENCES.</text>
        </g>
      </svg>

      <h1 class="sr-only">I build useful web experiences.</h1>

      <div class="intro">
        <p>From polished interfaces to robust APIs,<br />databases and deployment.</p>
        <div class="actions"><a href="#work">VIEW SELECTED WORK ↗</a><a href="#resume">DOWNLOAD RÉSUMÉ ↓</a></div>
      </div>
    </main>
  </body>
</html>
